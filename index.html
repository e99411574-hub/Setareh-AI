<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d0d0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Setareh AI">
<title>Setareh AI</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<script src="https://js.puter.com/v2/"></script>

<link rel="stylesheet" href="css/main.css">
</head>
<body data-theme="dark">

<!-- ============ منوی کشویی (History) ============ -->
<div class="sidebar-overlay" id="sidebarOverlay"></div>
<aside class="sidebar" id="sidebar">
  <div class="sidebar-top">
    <button class="new-chat-btn" onclick="CHAT.newChat()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 5v14M5 12h14"/>
      </svg>
      <span>چت جدید</span>
    </button>
  </div>

  <div class="sidebar-label">گفتگوها</div>
  <div class="sidebar-list" id="sidebarList">
    <div class="sidebar-empty">هنوز چتی نداری</div>
  </div>

  <div class="sidebar-bottom">
    <div class="sidebar-version">Setareh AI • v2.0</div>
  </div>
</aside>

<!-- ============ نوار بالا ============ -->
<header class="top-bar">
  <button class="icon-btn" id="menuBtn" aria-label="menu">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <line x1="3" y1="6" x2="21" y2="6"/>
      <line x1="3" y1="12" x2="21" y2="12"/>
      <line x1="3" y1="18" x2="21" y2="18"/>
    </svg>
  </button>

  <div class="top-title">
    <span class="top-logo-dot"></span>
    <span class="top-logo">Setareh</span>
  </div>

  <button class="icon-btn" id="themeBtn" aria-label="theme"></button>
</header>

<!-- ============ اپ ============ -->
<main class="app">
  <div class="chat-area" id="chatArea">
    <div class="welcome" id="chatWelcome">
      <div class="welcome-logo">
        <div class="logo-orb"></div>
        <div class="logo-rings">
          <span></span><span></span><span></span>
        </div>
        <div class="logo-star">✦</div>
      </div>
      <div class="welcome-title">سلام! من <span class="grad-text">ستاره</span> هستم</div>
      <div class="welcome-sub">چطور می‌تونم امروز کمکت کنم؟</div>

      <div class="suggestions">
        <button class="sug-card" data-prompt="یه عکس از یه گربه فضانورد بساز">
          <div class="sug-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="2"/>
              <circle cx="8.5" cy="8.5" r="1.5"/>
              <polyline points="21 15 16 10 5 21"/>
            </svg>
          </div>
          <div class="sug-text">
            <div class="sug-title">ساخت عکس</div>
            <div class="sug-desc">یه تصویر از تخیلت بساز</div>
          </div>
        </button>

        <button class="sug-card" data-prompt="یه شعر کوتاه درباره پاییز بنویس">
          <div class="sug-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 20h9"/>
              <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
            </svg>
          </div>
          <div class="sug-text">
            <div class="sug-title">نوشتن</div>
            <div class="sug-desc">شعر، متن، ایمیل بنویس</div>
          </div>
        </button>

        <button class="sug-card" data-prompt="کوانتوم رو خیلی ساده برام توضیح بده">
          <div class="sug-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/>
              <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/>
              <line x1="12" y1="17" x2="12.01" y2="17"/>
            </svg>
          </div>
          <div class="sug-text">
            <div class="sug-title">توضیح بده</div>
            <div class="sug-desc">هر موضوعی رو ساده بفهم</div>
          </div>
        </button>

        <button class="sug-card" data-prompt="چند تا ایده خلاقانه برای یه پروژه جدید بده">
          <div class="sug-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 18h6"/>
              <path d="M10 22h4"/>
              <path d="M12 2a7 7 0 0 0-7 7c0 2.38 1.19 4.47 3 5.74V17a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1v-2.26c1.81-1.27 3-3.36 3-5.74a7 7 0 0 0-7-7z"/>
            </svg>
          </div>
          <div class="sug-text">
            <div class="sug-title">ایده بده</div>
            <div class="sug-desc">پروژه، کار، کسب‌وکار</div>
          </div>
        </button>
      </div>
    </div>
  </div>

  <!-- نوار ارسال -->
  <div class="input-wrap">
    <div class="input-bar">
      <button class="icon-btn" id="attachBtn" title="آپلود">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
        </svg>
      </button>
      <div class="chat-attachments" id="chatAttachments"></div>
      <input type="text" id="chatInput" placeholder="از ستاره بپرس...">
      <button class="icon-btn voice-btn" id="chatVoiceBtn" title="ضبط صدا">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" y1="19" x2="12" y2="23"/>
        </svg>
      </button>
      <button class="send-btn" id="chatSendBtn" title="ارسال">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"/>
          <polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>
    <div class="input-hint">ستاره می‌تونه اشتباه کنه. نتیجه رو بررسی کن.</div>
  </div>

  <input type="file" id="chatFileInput" accept="image/*,video/*" style="display:none" multiple>
</main>

<!-- ============ ضبط صدا ============ -->
<div class="voice-overlay" id="voiceIndicator" style="display:none">
  <div class="voice-waves">
    <span></span><span></span><span></span><span></span><span></span>
  </div>
  <div class="voice-text" id="voiceText">در حال شنیدن...</div>
  <button class="voice-stop" id="voiceStopBtn">توقف</button>
</div>

<!-- ============ Toast ============ -->
<div id="toast" class="toast"></div>

<!-- ============ Eruda Console (دیباگ) ============ -->
<script src="https://cdn.jsdelivr.net/npm/eruda"></script>
<script>eruda.init();</script>

<!-- ============ اسکریپت‌ها ============ -->
<script src="js/chat.js"></script>
<script src="js/app.js"></script>

</body>
                                                           </html>
