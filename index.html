<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Setareh AI">
<title>Setareh AI</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<script src="https://js.puter.com/v2/"></script>

<link rel="stylesheet" href="css/main.css">
</head>
<body data-theme="dark">

<!-- ============ نوار بالا ============ -->
<header class="top-bar">
  <button class="icon-btn" id="themeBtn" aria-label="theme"></button>

  <div class="top-title">
    <span class="top-logo">Setareh AI</span>
  </div>

  <button class="icon-btn" id="menuBtn" aria-label="menu">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <line x1="3" y1="6" x2="21" y2="6"/>
      <line x1="3" y1="12" x2="21" y2="12"/>
      <line x1="3" y1="18" x2="21" y2="18"/>
    </svg>
  </button>
</header>

<!-- ============ منوی کناری ============ -->
<div class="side-overlay" id="sideOverlay"></div>
<aside class="side-menu" id="sideMenu">
  <div class="side-header">
    <div class="side-title">Setareh AI</div>
    <button class="icon-btn small" id="closeMenuBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <line x1="18" y1="6" x2="6" y2="18"/>
        <line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>
  </div>
  <nav class="side-nav">
    <button class="side-item" data-go="chat">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
      <span>چت</span>
    </button>
    <button class="side-item" data-go="image">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="2"/>
        <circle cx="8.5" cy="8.5" r="1.5"/>
        <polyline points="21 15 16 10 5 21"/>
      </svg>
      <span>ساخت عکس</span>
    </button>
  </nav>
  <div class="side-footer">
    <div class="side-version">نسخه ۱.۰</div>
  </div>
</aside>

<!-- ============ اپ ============ -->
<main class="app">

  <!-- ============ پنل ۱: چت ============ -->
  <section id="view-chat" class="view active">
    <div class="chat-head">
      <div class="chat-head-title">Setareh</div>
      <div class="chat-head-actions">
        <button class="icon-btn small" id="chatHistoryBtn" title="تاریخچه">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
            <path d="M3 3v5h5"/>
            <path d="M12 7v5l4 2"/>
          </svg>
        </button>
        <button class="icon-btn small" id="chatNewBtn" title="چت جدید">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 5v14M5 12h14"/>
          </svg>
        </button>
        <button class="icon-btn small" id="chatSearchBtn" title="جستجو">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="11" cy="11" r="8"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
        </button>
        <button class="icon-btn small" id="chatClearBtn" title="پاک کردن">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <polyline points="3 6 5 6 21 6"/>
            <path d="M19 6l-2 14a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L5 6"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="chat-search-bar" id="chatSearchBar" style="display:none">
      <input type="text" id="chatSearchInput" placeholder="جستجو در پیام‌ها...">
      <button class="icon-btn small" id="closeSearchBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>

    <div class="chat-area" id="chatArea">
      <div class="chat-welcome" id="chatWelcome">
        <div class="welcome-logo">Setareh AI</div>
        <div class="welcome-sub">چطور می‌تونم کمکت کنم؟</div>
        <div class="welcome-chips">
          <button class="chip" data-prompt="یه شعر کوتاه درباره بهار بنویس">شعر بگو</button>
          <button class="chip" data-prompt="یه ایده برای یه اپلیکیشن جدید بده">ایده بده</button>
          <button class="chip" data-prompt="یه سوال ریاضی رو برام توضیح بده">کمک درسی</button>
        </div>
      </div>
    </div>

    <!-- ضبط صدا -->
    <div class="voice-indicator" id="voiceIndicator" style="display:none">
      <div class="voice-waves">
        <span></span><span></span><span></span><span></span><span></span>
      </div>
      <div class="voice-text" id="voiceText">در حال شنیدن...</div>
      <button class="voice-stop" id="voiceStopBtn">متوقف کن</button>
    </div>

    <!-- نوار ارسال -->
    <div class="chat-input-bar">
      <button class="icon-btn" id="chatAttachBtn" title="آپلود">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="12" y1="5" x2="12" y2="19"/>
          <line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
      </button>
      <div class="chat-attachments" id="chatAttachments"></div>
      <input type="text" id="chatInput" placeholder="پیامت رو بنویس...">
      <button class="icon-btn voice-btn" id="chatVoiceBtn" title="ضبط صدا">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" y1="19" x2="12" y2="23"/>
        </svg>
      </button>
      <button class="send-btn" id="chatSendBtn" title="ارسال">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"/>
          <polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>

    <input type="file" id="chatFileInput" accept="image/*,video/*" style="display:none" multiple>
  </section>

  <!-- ============ پنل ۲: ساخت عکس ============ -->
  <section id="view-image" class="view">
    <div class="panel-header">
      <h1>ساخت عکس</h1>
      <p class="panel-sub">تصورت رو بنویس، عکسش رو بساز</p>
    </div>

    <div class="input-card">
      <textarea id="imagePrompt" placeholder="مثلاً: یه گربه سفید که توی بارون نشسته، سبک انیمه" rows="3"></textarea>
      <button class="btn-primary" id="imageBtn">ساخت عکس</button>
    </div>

    <div id="imageResult" class="result-area"></div>
  </section>

</main>

<!-- ============ نوار پایین ============ -->
<nav class="bottom-nav">
  <button class="nav-btn active" data-view="chat">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
    </svg>
    <span>چت</span>
  </button>
  <button class="nav-btn" data-view="image">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="18" height="18" rx="2"/>
      <circle cx="8.5" cy="8.5" r="1.5"/>
      <polyline points="21 15 16 10 5 21"/>
    </svg>
    <span>عکس</span>
  </button>
</nav>

<!-- ============ Toast ============ -->
<div id="toast" class="toast"></div>

<!-- ============ اسکریپت‌ها ============ -->
<script src="js/router.js"></script>
<script src="js/image.js"></script>
<script src="js/chat.js"></script>
<script src="js/app.js"></script>

</body>
  </html>
